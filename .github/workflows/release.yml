name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: idgen
            asset_name: idgen-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: idgen.exe
            asset_name: idgen-windows-amd64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: idgen
            asset_name: idgen-macos-amd64
          # Apple Silicon. Without this, the Homebrew formula's arm64 branch
          # points at an asset that does not exist, and every M-series Mac
          # fails to install.
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: idgen
            asset_name: idgen-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build Release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename Binary
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}
          # Release notes are a committed artefact, read from the tagged commit
          # itself — so the notes always describe exactly the code being
          # released. Previously nothing passed a body here and every Release
          # was created empty, relying on someone remembering to paste notes in
          # afterwards. release.sh now refuses to tag if this file is missing.
          body_path: docs/release/${{ github.ref_name }}.md
          # Each matrix job runs this step; without fail_on_unmatched_files the
          # body would be silently blanked if the path were ever wrong.
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
